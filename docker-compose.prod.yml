services:
  openstrm:
    image: indown/openstrm:latest
    container_name: openstrm
    ports:
      - "3000:3000"   # 管理界面 + API
      - "8091:8091"   # Emby 302 代理（Emby 客户端连这个端口）
    environment:
      - NODE_ENV=production
      # 定时任务按这个时区解释 cron 表达式。不设的话容器是 UTC，`0 3 * * *` 会在北京时间 11:00 跑
      - TZ=Asia/Shanghai
      # 用非 root 身份跑（NAS 上填自己的 uid/gid，`id` 命令能看到）。不设保持 root。
      # 之前用 root 跑出来的 ./data 里的文件要自己 chown 一次，config 目录会自动改归属
      # - PUID=1000
      # - PGID=1000
      # JWT_SECRET 不用设：首次启动会随机生成并存进 config/openstrm.db。
      # 只有需要轮换密钥、或多个副本共享同一份登录令牌时才手动指定。
      # - JWT_SECRET=
      # 排查「播放没走 302」时把级别调到 debug
      # - LOG_LEVEL=debug
    volumes:
      - ./data:/app/data         # 生成的 strm 文件
      - ./config:/app/config     # openstrm.db：账号、设置、任务、执行历史、登录凭据
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
