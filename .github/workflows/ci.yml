name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # shared 是 workspace 依赖，后端的 tsc 要先有它的 d.ts
      - name: Build shared package
        run: pnpm build:shared

      - run: pnpm typecheck

      # 用例会写 settings 表，必须指到临时目录——
      # 不给 CONFIG_DIR 的话代理那两个 suite 会直接拒绝运行
      - name: Unit and integration tests
        working-directory: apps/backend
        env:
          CONFIG_DIR: ${{ runner.temp }}/openstrm-config
          DATA_DIR: ${{ runner.temp }}/openstrm-data
        run: pnpm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只构不推、只 amd64；多架构留给 release
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: openstrm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建成功不代表能跑，必须真起一次。
      # 判据是服务在不在应答，不是进程名：Next.js 会设置 process.title，
      # Linux 上这会覆写 argv，按路径 pgrep 找不到。
      - name: Smoke test
        run: |
          set -u
          docker run -d --name smoke \
            -p 3000:3000 -p 4000:4000 -p 8091:8091 openstrm:ci

          # 端口有响应即算存活。curl 连不上时自己就会打印 000，
          # 这里的 || true 只用来吞掉它的非零退出码（run 默认带 -e），
          # 不能再 echo 一个 000——那样输出会变成 000000，判据就永远为真了。
          probe() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$1" 2>/dev/null || true
          }

          for i in $(seq 1 30); do
            [ "$(probe http://127.0.0.1:3000/)" = "200" ] && { ready=1; break; }
            sleep 2
          done

          echo "--- 容器日志 ---"
          docker logs smoke 2>&1 | tail -30

          [ "${ready:-0}" = "1" ] || { echo "::error::前端未在 60 秒内就绪"; exit 1; }
          echo "  前端 :3000 -> 200"

          # API 和代理只要求"在监听"：没配 Emby 时代理回源失败是正常的，
          # 返回 500 也说明进程活着，只有 000 才是没起来
          for svc in "API :4000 http://127.0.0.1:4000/" \
                     "代理 :8091 http://127.0.0.1:8091/System/Info/Public"; do
            set -- $svc
            code=$(probe "$3")
            [ "$code" != "000" ] || { echo "::error::$1 $2 无响应"; exit 1; }
            echo "  $1 $2 -> $code"
          done

          # 迁移文件必须进了镜像，否则容器起来面对的是空库
          docker exec smoke sh -c 'ls /app/backend/dist/db/migrations/*.sql >/dev/null' \
            || { echo "::error::镜像里没有迁移文件"; exit 1; }

          # 启动日志里不该有模块解析失败
          if docker logs smoke 2>&1 | grep -q "Cannot find package\|Cannot find module"; then
            echo "::error::启动日志出现模块解析失败"
            exit 1
          fi
          echo "冒烟测试通过"

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true
