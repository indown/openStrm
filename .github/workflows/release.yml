name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io

jobs:
  # 两个架构各用原生 runner 分别构建，再合并成多架构 manifest——
  # QEMU 模拟下 next build 慢得多。
  #
  # digest 走 artifact 传给 merge 作业：矩阵作业的 outputs 会互相覆盖。
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 镜像名必须全小写，而 github.repository 可能带大写（本仓库就是 openStrm）。
      # metadata-action 会自己转小写，但 push-by-digest 和 imagetools 用的是原始值。
      - name: Resolve image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "name=${REGISTRY}/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest and release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 镜像名必须全小写，而 github.repository 可能带大写（本仓库就是 openStrm）。
      # metadata-action 会自己转小写，但 push-by-digest 和 imagetools 用的是原始值。
      - name: Resolve image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "name=${REGISTRY}/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # v 前缀必须交给 flavor：type=semver 碰上预发布版本会丢掉 pattern，
      # 改用写死的 {{version}}，v2.0.0-rc.7 于是被推成了 2.0.0-rc.7。
      # flavor 的 prefix 是在那之后才拼上去的，两种标签都保得住 v；
      # latest 默认不吃 prefix，也不会变成 vlatest。
      #
      # latest 只跟正式版走：latest=auto 认得预发布版本，自己就不会动 latest，
      # 免得尝鲜版把 latest 的用户一起带走。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
            prefix=v
          tags: |
            type=semver,pattern={{version}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect \
            ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          # 判据和上面的 latest=auto 一致：带连字符的就是预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
