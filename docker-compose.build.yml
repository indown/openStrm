services:
  openstrm:
    build: .
    image: indown/openstrm:latest
    container_name: openstrm
    ports:
      - "3000:3000"   # 管理界面 + API
      - "8091:8091"   # Emby 302 代理（Emby 客户端连这个端口）
    environment:
      - NODE_ENV=production
      # 定时任务按这个时区解释 cron 表达式。不设的话容器是 UTC，`0 3 * * *` 会在北京时间 11:00 跑
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
